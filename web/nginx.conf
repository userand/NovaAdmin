# Nova Admin · 前端 Nginx 配置
# - 托管 Vite 构建产物(单页应用，未知路径回落到 index.html)
# - /api 反向代理到后端容器(同源访问，无需 CORS)

upstream nova_server {
    server server:3200;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 上传接口最大 5MB(后端同样限制)，留一点余量给 multipart 头
    client_max_body_size 6m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/xml;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 容器健康检查
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ---- 后端 API ----
    location /api/ {
        proxy_pass http://nova_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # 后端(helmet / 上传目录)已自行设置这些头，去掉 server 级重复添加的一份
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        # 用 $remote_addr 覆盖而不是追加：客户端自带的 X-Forwarded-For 一律丢弃，防止伪造 IP。
        # 如果本 Nginx 前面还有一层负载均衡/CDN，请改为 $proxy_add_x_forwarded_for 并按层数设置后端 TRUST_PROXY。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # ---- 静态资源：文件名带 hash，可长期缓存 ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
        try_files $uri =404;
    }

    # ---- 单页应用：index.html 不缓存，其余路径回落 ----
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /index.html;
    }
}
